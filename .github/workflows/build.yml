name: build

on:
  push:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - run: cmake -B build
    - run: cmake --build build --config Release
    - uses: actions/upload-artifact@v7
      with:
        name: voice-hid-transmitter
        path: build/Release/voice-hid-transmitter.exe
